name: Monthly data refresh

on:
  schedule:
    - cron: "0 12 5 * *"   # 5th of each month, 12:00 UTC (after most monthly FRED releases)
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: debt_cycle
          POSTGRES_USER: bi_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bi_user -d debt_cycle"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          POSTGRES_HOST: localhost
          POSTGRES_DB: debt_cycle
          POSTGRES_USER: bi_user
          POSTGRES_PASSWORD: ci_password
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: python -m etl.run_pipeline

      - name: Commit refreshed reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "Monthly refresh: validation report and executive brief"
          git push
