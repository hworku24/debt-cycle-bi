<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Helvetica, Arial, sans-serif">
  <style>
    .frame { fill: #fafafa; stroke: #999; }
    .box { fill: #fff; stroke: #bbb; }
    .accent { fill: #eee; stroke: #bbb; }
    .t { fill: #333; font-size: 13px; }
    .small { fill: #777; font-size: 10px; }
    .big { fill: #222; font-size: 20px; font-weight: bold; }
  </style>
  <rect x="10" y="10" width="780" height="500" class="frame"/>
  <text x="30" y="42" class="big">Page 1 · Current Conditions</text>
  <text x="30" y="60" class="small">Latest month: YYYY-MM · vs 12 months ago · filters: date range</text>

  <!-- KPI tiles row 1 -->
  <g>
    <rect x="30" y="80" width="175" height="90" class="box"/>
    <text x="42" y="102" class="small">CYCLE PRESSURE SCORE</text>
    <text x="42" y="132" class="big">1.24 ▲</text>
    <text x="42" y="155" class="small">+0.31 vs last year</text>

    <rect x="222" y="80" width="175" height="90" class="box"/>
    <text x="234" y="102" class="small">HOUSEHOLD DEBT / GDP</text>
    <text x="234" y="132" class="big">73.9% ▼</text>
    <text x="234" y="155" class="small">-0.8 pp vs last year</text>

    <rect x="414" y="80" width="175" height="90" class="box"/>
    <text x="426" y="102" class="small">DEBT SERVICE RATIO</text>
    <text x="426" y="132" class="big">9.8% ▲</text>
    <text x="426" y="155" class="small">+0.2 pp vs last year</text>

    <rect x="606" y="80" width="164" height="90" class="box"/>
    <text x="618" y="102" class="small">CC DELINQUENCY</text>
    <text x="618" y="132" class="big">3.2% ▲</text>
    <text x="618" y="155" class="small">+0.5 pp vs last year</text>
  </g>

  <!-- KPI tiles row 2 -->
  <g>
    <rect x="30" y="185" width="175" height="90" class="box"/>
    <text x="42" y="207" class="small">FED FUNDS RATE</text>
    <text x="42" y="237" class="big">4.25%</text>

    <rect x="222" y="185" width="175" height="90" class="box"/>
    <text x="234" y="207" class="small">UNEMPLOYMENT</text>
    <text x="234" y="237" class="big">4.1%</text>

    <rect x="414" y="185" width="175" height="90" class="box"/>
    <text x="426" y="207" class="small">CPI YOY</text>
    <text x="426" y="237" class="big">2.6%</text>

    <rect x="606" y="185" width="164" height="90" class="box"/>
    <text x="618" y="207" class="small">YIELD CURVE</text>
    <text x="618" y="237" class="big">+0.42 pp</text>
    <text x="618" y="260" class="small">not inverted</text>
  </g>

  <!-- Sparkline strip -->
  <rect x="30" y="295" width="740" height="195" class="accent"/>
  <text x="42" y="318" class="t">24-month sparklines, one per KPI</text>
  <g stroke="#888" fill="none">
    <polyline points="50,370 90,362 130,368 170,355 210,358 250,345 290,350"/>
    <polyline points="330,360 370,352 410,358 450,365 490,358 530,368 570,362"/>
    <polyline points="50,440 90,448 130,435 170,442 210,430 250,438 290,428"/>
    <polyline points="330,432 370,440 410,436 450,428 490,435 530,425 570,430"/>
  </g>
  <text x="610" y="380" class="small">□ spark: pressure score</text>
  <text x="610" y="400" class="small">□ spark: delinquency</text>
  <text x="610" y="420" class="small">□ spark: fed funds</text>
  <text x="610" y="440" class="small">□ spark: unemployment</text>
</svg>
