<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Helvetica, Arial, sans-serif">
  <style>
    .frame { fill: #fafafa; stroke: #999; }
    .box { fill: #fff; stroke: #bbb; }
    .t { fill: #333; font-size: 13px; }
    .small { fill: #777; font-size: 10px; }
    .big { fill: #222; font-size: 20px; font-weight: bold; }
  </style>
  <rect x="10" y="10" width="780" height="500" class="frame"/>
  <text x="30" y="42" class="big">Page 3 · State Drill-Down (micro)</text>
  <text x="30" y="60" class="small">Latest month · click a state to filter the trend chart · filters: month, state</text>

  <!-- Choropleth -->
  <rect x="30" y="75" width="430" height="270" class="box"/>
  <text x="42" y="95" class="t">State unemployment choropleth</text>
  <g stroke="#aaa">
    <rect x="70" y="120" width="70" height="55" fill="#ddd"/>
    <rect x="140" y="120" width="60" height="55" fill="#bbb"/>
    <rect x="200" y="120" width="80" height="55" fill="#eee"/>
    <rect x="280" y="120" width="65" height="55" fill="#ccc"/>
    <rect x="70" y="175" width="55" height="60" fill="#ccc"/>
    <rect x="125" y="175" width="85" height="60" fill="#eee"/>
    <rect x="210" y="175" width="70" height="60" fill="#bbb"/>
    <rect x="280" y="175" width="65" height="60" fill="#ddd"/>
    <rect x="120" y="235" width="90" height="55" fill="#ddd"/>
    <rect x="210" y="235" width="100" height="55" fill="#eee"/>
    <rect x="345" y="150" width="60" height="90" fill="#ccc"/>
  </g>
  <text x="42" y="330" class="small">shade = unemployment rate (light low, dark high)</text>

  <!-- Trend chart -->
  <rect x="480" y="75" width="290" height="270" class="box"/>
  <text x="492" y="95" class="t">Selected state vs national</text>
  <g stroke="#555" fill="none">
    <polyline points="495,290 540,270 585,285 630,240 675,255 720,220 758,230"/>
  </g>
  <g stroke="#aaa" fill="none" stroke-dasharray="4 3">
    <polyline points="495,300 540,290 585,295 630,275 675,280 720,260 758,265"/>
  </g>
  <text x="590" y="130" class="small">— selected state   ---- national</text>

  <!-- Table -->
  <rect x="30" y="360" width="740" height="135" class="box"/>
  <text x="42" y="380" class="t">Top and bottom 10 states, with 12-month change</text>
  <g class="small">
    <text x="42" y="405">state | rate | 12-mo change</text>
    <text x="42" y="425">NV    | 5.6% | +0.4 pp</text>
    <text x="42" y="445">CA    | 5.3% | +0.2 pp</text>
    <text x="42" y="465">...</text>
    <text x="420" y="405">state | rate | 12-mo change</text>
    <text x="420" y="425">SD    | 1.9% | -0.1 pp</text>
    <text x="420" y="445">ND    | 2.1% |  0.0 pp</text>
    <text x="420" y="465">...</text>
  </g>
</svg>
